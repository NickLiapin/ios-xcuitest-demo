name: DemoApp
options:
  bundleIdPrefix: com.nickliapin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DemoApp:
    type: application
    platform: iOS
    sources:
      - path: DemoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickliapin.DemoApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  DemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DemoAppUITests
    dependencies:
      - target: DemoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickliapin.DemoAppUITests
        TEST_TARGET_NAME: DemoApp
schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
        DemoAppUITests: [test]
    test:
      targets:
        - DemoAppUITests
